services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice_analyst
    ports:
      - "5433:5432"
    volumes:
      # The postgres:18 image keeps data under /var/lib/postgresql/<major>/, so mount the parent
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice_analyst"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
